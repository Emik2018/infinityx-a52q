name: Check Galaxy A52 Android 17 Sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository branches
        shell: bash
        run: |
          set +e

          check_repo() {
            local url="$1"
            echo
            echo "===== $url ====="
            git ls-remote --heads "$url" \
              'refs/heads/17.0' \
              'refs/heads/lineage-23.2' \
              'refs/heads/lineage-22.2'
            if [ $? -ne 0 ]; then
              echo "Could not query repository (it may be missing or inaccessible)."
            fi
          }

          check_repo https://github.com/crdroidandroid/android_device_samsung_a52q.git
          check_repo https://github.com/crdroidandroid/android_device_samsung_sm7125-common.git
          check_repo https://github.com/crdroidandroid/android_kernel_samsung_sm7125.git
          check_repo https://github.com/ProjectInfinity-X/manifest.git

          echo
          echo "Check finished. A blank result means the requested branch was not found.";
