name: Check Galaxy A52 Android 17 Sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check crDroid 17.0 device branches
        shell: bash
        run: |
          set -euo pipefail

          check_branch() {
            local url="$1"
            local branch="$2"
            echo
            echo "===== $url ($branch) ====="
            if git ls-remote --exit-code --heads "$url" "refs/heads/$branch"; then
              echo "FOUND: $branch"
            else
              echo "MISSING: $branch"
              exit 1
            fi
          }

          check_branch https://github.com/crdroidandroid/android_device_samsung_a52q.git 17.0
          check_branch https://github.com/crdroidandroid/android_device_samsung_sm7125-common.git 17.0
          check_branch https://github.com/crdroidandroid/android_kernel_samsung_sm7125.git 17.0
          check_branch https://github.com/ProjectInfinity-X/manifest.git 17
          echo
          echo "All requested branches were found."
