name: Build Infinity-X v4.0 (Android 17) for Galaxy A52

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Prepare Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf lib32readline-dev lib32z1-dev libelf-dev libgl1-mesa-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 repo
        git config --global user.name "Emik2018"
        git config --global user.email "emik2018@github.com"

    - name: Download Infinity-X v4.0 (Android 17) Source Code
      run: |
        mkdir -p ~/infinity && cd ~/infinity
        repo init -u https://github.com/ProjectInfinity-X/manifest --depth=1 --git-lfs
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --depth=1

    - name: Clone A52 Trees
      run: |
        cd ~/infinity
        git clone https://github.com/LineageOS/android_device_samsung_a52q -b lineage-22.1 --depth=1 device/samsung/a52q || git clone https://github.com/LineageOS/android_device_samsung_a52q -b lineage-21 --depth=1 device/samsung/a52q
        git clone https://github.com/LineageOS/android_device_samsung_sm7125-common -b lineage-22.1 --depth=1 device/samsung/sm7125-common || git clone https://github.com/LineageOS/android_device_samsung_sm7125-common -b lineage-21 --depth=1 device/samsung/sm7125-common
        git clone https://github.com/TheMuppets/proprietary_vendor_samsung_a52q -b lineage-22.1 --depth=1 vendor/samsung/a52q || git clone https://github.com/TheMuppets/proprietary_vendor_samsung_a52q -b lineage-21 --depth=1 vendor/samsung/a52q
        git clone https://github.com/TheMuppets/proprietary_vendor_samsung_sm7125-common -b lineage-22.1 --depth=1 vendor/samsung/sm7125-common || git clone https://github.com/TheMuppets/proprietary_vendor_samsung_sm7125-common -b lineage-21 --depth=1 vendor/samsung/sm7125-common
        git clone https://github.com/LineageOS/android_kernel_samsung_sm7125 -b lineage-22.1 --depth=1 kernel/samsung/sm7125 || git clone https://github.com/LineageOS/android_kernel_samsung_sm7125 -b lineage-21 --depth=1 kernel/samsung/sm7125

    - name: Compile Android 17 ROM
      run: |
        cd ~/infinity
        source build/envsetup.sh
        lunch infinity_a52q-userdebug || lunch lineage_a52q-userdebug
        mka bacon -j$(nproc --all)

    - name: Save ROM Zip
      uses: actions/upload-artifact@v4
      with:
        name: Infinity-X-v4.0-Android17-A52
        path: ~/infinity/out/target/product/a52q/*.zip
